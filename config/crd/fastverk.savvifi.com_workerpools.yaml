            properties:
              concurrency:
                default: 4
                description: |-
                  Concurrency is action slots per worker pod (total live slots = replicas ×
                  concurrency).
                format: int32
                minimum: 1
                type: integer
              containerImage:
                description: |-
                  ContainerImage is advertised to the scheduler for action routing + the RBE
